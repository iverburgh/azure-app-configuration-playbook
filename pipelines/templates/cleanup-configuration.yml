# Removes configuration sets of one app that are no longer needed, after a successful deployment.
#
# Remove-ObsoleteConfigurationSets.ps1 keeps the set of this deployment and the sets that the
# production and staging slots point at: the live set and the rollback target always survive.
# It refuses to run when neither slot carries the label of this deployment.
#
# Needs App Configuration Data Owner on the store and Website Contributor on the web app.

parameters:
- name: serviceConnection
  type: string
- name: storeEndpoint
  type: string
- name: resourceGroup
  type: string
- name: webAppName
  type: string
- name: appName
  type: string
- name: label # the label of this deployment
  type: string
- name: stopStagingWhenDone
  type: boolean
  default: true
- name: scriptsPath
  type: string

steps:
- task: AzureCLI@2
  displayName: Remove obsolete configuration sets
  inputs:
    azureSubscription: ${{ parameters.serviceConnection }}
    scriptType: pscore
    scriptLocation: scriptPath
    scriptPath: ${{ parameters.scriptsPath }}/Remove-ObsoleteConfigurationSets.ps1
    arguments: >-
      -StoreEndpoint '${{ parameters.storeEndpoint }}'
      -AppName '${{ parameters.appName }}'
      -ResourceGroup '${{ parameters.resourceGroup }}'
      -WebAppName '${{ parameters.webAppName }}'
      -CurrentLabel '${{ parameters.label }}'

- ${{ if parameters.stopStagingWhenDone }}:
  - task: AzureCLI@2
    displayName: Stop the staging slot
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: >-
        az webapp stop --resource-group '${{ parameters.resourceGroup }}'
        --name '${{ parameters.webAppName }}' --slot staging
