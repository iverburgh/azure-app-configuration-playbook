# Rolls a failed deployment back: production returns to the previous application and, because the
# label app setting moves with the swap, to the previous configuration set as a whole.
#
# Undo-ConfigurationSet.ps1 does nothing (with a warning) when production does not carry the
# failed label, for example when the deployment failed before the swap. Otherwise it checks that
# staging carries a different label whose set still exists, removes the warm-up settings from
# staging and swaps back. The swap restarts and warms up the staging instances, and staging may
# have been stopped after an earlier deployment, so it is started first.
#
# Feature flag definitions are not rolled back; see docs/deployment-and-rollback.md.

parameters:
- name: serviceConnection
  type: string
- name: storeEndpoint
  type: string
- name: resourceGroup
  type: string
- name: webAppName
  type: string
- name: appName
  type: string
- name: label # the label of the failed deployment
  type: string
- name: stopStagingWhenDone
  type: boolean
  default: true
- name: scriptsPath
  type: string

steps:
- task: AzureCLI@2
  displayName: Start the staging slot
  inputs:
    azureSubscription: ${{ parameters.serviceConnection }}
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: >-
      az webapp start --resource-group '${{ parameters.resourceGroup }}'
      --name '${{ parameters.webAppName }}' --slot staging

- task: AzureCLI@2
  displayName: Swap back to the previous configuration set
  inputs:
    azureSubscription: ${{ parameters.serviceConnection }}
    scriptType: pscore
    scriptLocation: scriptPath
    scriptPath: ${{ parameters.scriptsPath }}/Undo-ConfigurationSet.ps1
    arguments: >-
      -ResourceGroup '${{ parameters.resourceGroup }}'
      -WebAppName '${{ parameters.webAppName }}'
      -StoreEndpoint '${{ parameters.storeEndpoint }}'
      -AppName '${{ parameters.appName }}'
      -Label '${{ parameters.label }}'

- ${{ if parameters.stopStagingWhenDone }}:
  - task: AzureCLI@2
    displayName: Stop the staging slot
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: >-
        az webapp stop --resource-group '${{ parameters.resourceGroup }}'
        --name '${{ parameters.webAppName }}' --slot staging
