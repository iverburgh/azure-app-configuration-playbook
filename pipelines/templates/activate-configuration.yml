# Activates an imported configuration set by swapping it into production with the application.
#
# 1. Set-SlotConfigurationLabel.ps1 points the staging slot at the set: it sets the label app
#    setting (not slot-sticky, so it moves with the swap), rewrites App Configuration references
#    to the same label and sets the swap warm-up settings. It fails when the set does not exist.
# 2. Switch-ConfigurationSet.ps1 swaps staging into production and checks that production now
#    carries the label. Production's previous label ends up on staging: the rollback target.
#
# Both do nothing when production already carries the label, so a rerun is harmless.
# Needs App Configuration Data Owner (or Data Reader) on the store and Website Contributor on the
# web app.
#
# include: all runs both steps; point runs only step 1, swap only step 2. A deployment job runs
# point before it deploys the package, so the new code starts with its own set, and swap later.

parameters:
- name: serviceConnection
  type: string
- name: storeEndpoint
  type: string
- name: resourceGroup
  type: string
- name: webAppName
  type: string
- name: appName
  type: string
- name: label
  type: string
- name: healthCheckPath
  type: string
  default: ''
- name: scriptsPath
  type: string
- name: include
  type: string
  default: all
  values: [all, point, swap]

steps:
- ${{ if ne(parameters.include, 'swap') }}:
  - task: AzureCLI@2
    displayName: Point the staging slot at configuration set ${{ parameters.label }}
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: pscore
      scriptLocation: scriptPath
      scriptPath: ${{ parameters.scriptsPath }}/Set-SlotConfigurationLabel.ps1
      arguments: >-
        -ResourceGroup '${{ parameters.resourceGroup }}'
        -WebAppName '${{ parameters.webAppName }}'
        -StoreEndpoint '${{ parameters.storeEndpoint }}'
        -AppName '${{ parameters.appName }}'
        -Label '${{ parameters.label }}'
        ${{ iif(parameters.healthCheckPath, format('-HealthCheckPath ''{0}''', parameters.healthCheckPath), '') }}

- ${{ if ne(parameters.include, 'point') }}:
  - task: AzureCLI@2
    displayName: Swap staging into production
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: pscore
      scriptLocation: scriptPath
      scriptPath: ${{ parameters.scriptsPath }}/Switch-ConfigurationSet.ps1
      arguments: >-
        -ResourceGroup '${{ parameters.resourceGroup }}'
        -WebAppName '${{ parameters.webAppName }}'
        -Label '${{ parameters.label }}'
